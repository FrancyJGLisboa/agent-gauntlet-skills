name: Gauntlet CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/gauntlet-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/gauntlet-cli/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - run: node scripts/verify-package.mjs .
      - run: node scripts/validate-skills.mjs ../../skills
      - run: node scripts/verify-agent-docs.mjs ../..
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm pack
        working-directory: packages/gauntlet-cli
      - run: npm install --global packages/gauntlet-cli/agent-gauntlet-cli-*.tgz
      - run: gauntlet --help
